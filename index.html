<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1, user-scalable=no">
<!-- iOS Web App capability tags -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Omnichord">
<!-- Links to your app icons and manifest -->
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">

<title>Omnichord</title>
<style>
*{box-sizing:border-box}
:root{--panel-spacing:12px;--chord-spacing:8px;--control-radius:8px;--viewport-inset:12px}
html,body{margin:0;height:100%;overflow:hidden;}
body{
  height:100vh;
  margin:0;
  padding:0;
  background:#000;
  color:#f2f2f7;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;
  user-select:none;
  -webkit-user-select:none;
  display:flex;
  overflow:hidden;
}
.app-wrapper{
  width:100%;
  height:100dvh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:0;
  box-sizing:border-box;
  overflow:hidden;
}
.app{
  width:1160px;
  min-width:1160px;
  max-width:1160px;
  height:580px;
  min-height:580px;
  max-height:580px;
  display:flex;
  gap:var(--panel-spacing);
  align-items:flex-start;
  position:relative;
  transform-origin:center center;
}

.center-content{flex:0 0 984px;width:984px;height:100%;display:flex;flex-direction:column;gap:0;min-width:984px;position:relative;}
.vertical-harp{width:auto;min-width:160px;flex:1;display:flex;flex-direction:column;gap:var(--panel-spacing);}

.transport,.select-wrap,.range-wrap{
  background:#1c1c1e;border:1px solid #2c2c2e;border-radius:var(--control-radius);
  min-height:36px;display:flex;align-items:center;width:100%;padding:0 10px;justify-content:center;gap:12px;
}
select{border:0;outline:none;background:#1c1c1e;color:#f2f2f7;font-size:12px;color-scheme:dark;text-align:right}

.beat-row{display:flex;gap:8px;width:100%;align-items:center;}
.beat-row .transport{flex:1;margin:0;min-height:36px;}
.transport{background:#1c1c1e;border:1px solid #2c2c2e;border-radius:var(--control-radius);color:#fff;cursor:pointer;font-size:13px;font-weight:600;}
.transport:hover{background:#2c2c2e}

.dialogue-btn{
  background:#2c2c2e;
  border:1px solid #3a3a3c;
  color:#f2f2f7;
  height:36px;
  border-radius:var(--control-radius);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  font-weight:600;
  flex:1;
  transition:background .15s, border-color .15s;
}
.dialogue-btn:hover{
  background:#3a3a3c;
}
.dialogue-btn.primary{
  border-color:#3a3a3c;
  color:#0a84ff;
}
.dialogue-btn.primary:hover, .dialogue-btn.primary:active, .dialogue-btn.primary.active{
  background:#3a3a3c;
  border-color:#3a3a3c;
  color:#ffffff;
}
.dialogue-btn.danger{
  color:#ff453a;
}
.dialogue-btn.danger:hover, .dialogue-btn.danger:active, .dialogue-btn.danger.active{
  background:#3a3a3c;
  border-color:#ff453a;
}

.section-label-header{font-size:10px;font-weight:700;color:#636366;text-transform:uppercase;letter-spacing:.8px;margin-top:4px;padding-left:2px;}

.top-toolbar{
  background:#1c1c1e;border:1px solid #2c2c2e;border-radius:12px;padding:8px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;height:92px;flex-shrink:0;position:relative;overflow-x:clip;overflow-y:visible;
}

.toolbar-divider{
  width:1px;background:#2c2c2e;height:72px;flex-shrink:0;margin:0 4px;
}

.controls-btn{
  background:#2c2c2e;border:1px solid #3a3a3c;color:#f2f2f7;width:36px;height:36px;
  border-radius:var(--control-radius);cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:background .15s, border-color .15s;font-size:16px;
}
.controls-btn:hover{background:#3a3a3c}
.controls-btn.active{background:#3a3a3c;border-color:#3a3a3c;}
.controls-btn:focus,
.dialogue-btn:focus,
.chromatic-highlight-ctrl-btn:focus,
button:focus-visible{
  outline:none;
}
.controls-btn img{width:16px;height:16px;display:block;object-fit:contain;flex:none;}
.controls-btn .piano-icon,.controls-btn .chord-grid-icon{width:16px;height:16px;}
.controls-btn .record-icon,.controls-btn #menuIcon{width:16px;height:16px;}
.controls-btn .stop-icon{width:14px;height:14px;}
.controls-btn .stop-icon{display:none;}
.controls-btn.recording .record-icon{display:none;}
.controls-btn.recording .stop-icon{display:block;}
.controls-btn svg{width:17px;height:17px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.controls-btn svg.piano-icon,
.controls-btn svg.piano-icon *{stroke:none;stroke-width:0;stroke-linecap:butt;stroke-linejoin:miter;}
.controls-btn .piano-icon{display:none;}
.controls-btn .chord-grid-icon{display:block;}
.controls-btn.active .piano-icon{display:block;}
.controls-btn.active .chord-grid-icon{display:none;}

.rec-btn{position:relative;}
.rec-dot{
  width:12px;height:12px;border-radius:50%;background:#ff3b30;
  display:inline-block;transition:transform 0.15s, border-radius 0.15s, background 0.15s;
}
.rec-btn.recording .rec-dot{
  border-radius:2px;background:#ff453a;
}

.record-dropdown{
  position:absolute;top:102px;left:0;width:320px;
  background:#1c1c1e;border:1px solid #2c2c2e;border-radius:12px;padding:14px;
  z-index:2000;box-shadow:0 20px 40px rgba(0,0,0,0.9);
  display:flex;flex-direction:column;gap:8px;overflow-y:auto;
  transform-origin:top;transform:scaleY(1);opacity:1;
  transition:transform .2s ease, opacity .2s ease;
}
.record-dropdown.collapsed{
  transform:scaleY(0);opacity:0;pointer-events:none;
}

.menu-dropdown{
  position:absolute;
  top:54px;
  left:0;
  width:160px;
  padding:8px;
  background:#1c1c1e;
  border:1px solid #2c2c2e;
  border-radius:10px;
  z-index:2100;
  box-shadow:0 20px 40px rgba(0,0,0,0.9);
  transform-origin:top left;
  transform:scaleY(1);
  opacity:1;
  transition:transform .2s ease, opacity .2s ease;
}
.menu-dropdown.collapsed{
  transform:scaleY(0);
  opacity:0;
  pointer-events:none;
}
.menu-dropdown button{
  width:100%;
  height:34px;
  border:1px solid #3a3a3c;
  border-radius:var(--control-radius);
  background:#2c2c2e;
  color:#f2f2f7;
  cursor:pointer;
  font:600 12px inherit;
}
.menu-dropdown button:hover{background:#3a3a3c}

.info-compact{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  width:100px;min-width:100px;height:100%;padding-right:6px;padding-left:6px;
  flex-shrink:0;text-align:center;
}
.current{font-size:12px;font-weight:700;line-height:1.2;text-align:center;word-break:break-word;}
.notes{font-size:10px;color:#aeaeb2;white-space:nowrap;text-align:center;}

.selectors-stack{
  display:flex;flex-direction:column;gap:4px;height:76px;justify-content:center;
  width:200px;min-width:200px;flex-shrink:0;overflow:hidden;
}
.selectors-desktop{display:flex;flex-direction:column;gap:4px;width:100%;height:100%;justify-content:center;}

.chromatic-highlight-ctrl-btn{
  height:26px;border:1px solid #2c2c2e;background:#1c1c1e;color:#8e8e93;
  border-radius:var(--control-radius);font-size:10px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:background .15s, border-color .15s;
  padding:0 4px;white-space:nowrap;flex-shrink:0;
}
.chromatic-highlight-ctrl-btn:hover{background:#2c2c2e}
.chromatic-highlight-ctrl-btn.highlight-state{
  color:#8e8e93;
  border-color:#2c2c2e;
}
.chromatic-highlight-ctrl-btn.lock-state{
  color:#30d158;
  border-color:#30d158;
}
.chromatic-highlight-ctrl-btn.clear-state{
  color:#ff453a;
  border-color:#ff453a;
}
.chromatic-highlight-ctrl-btn.voicing-state{
  color:#30d158;
  border-color:#30d158;
}
#arpeggioPaddingToggle{
  width:76px;
  min-width:76px;
  flex:0 0 76px;
}

.select-wrap-sm{
  background:#111113;border:1px solid #2c2c2e;border-radius:var(--control-radius);
  height:26px;display:flex;align-items:center;padding:0 6px;gap:4px;position:relative;
}
.select-wrap-sm label{font-size:9px;color:#8e8e93;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;position:relative;z-index:1;pointer-events:none;}
.select-wrap-sm select{font-size:10px;background:transparent;width:100%;min-width:0;flex:1 1 0;position:absolute;inset:0;padding:0 6px 0 30px;}
.select-wrap-sm select:disabled{color:#48484a;cursor:not-allowed;}
.select-wrap-sm{cursor:pointer;}
.select-wrap-sm select{cursor:pointer;}
.select-wrap-sm select:disabled{cursor:not-allowed;}

.articulation-section {
  display: flex;
  flex-direction: column;
  gap: 4px;
  width: 262px;
  flex-shrink: 0;
  height: 76px;
  justify-content: center;
}
.articulation-sub-row {
  display: flex;
  gap: 8px;
  width: 100%;
  align-items: center;
}
.articulation-sub-row#arpeggioSubControls{
  justify-content:flex-start;
  padding-right:2px;
}
.articulation-sub-row#arpeggioSubControls > .select-wrap-sm,
.articulation-sub-row#arpeggioSubControls > #arpeggioPaddingToggle{
  flex:0 0 auto;
}
.articulation-sub-row#arpeggioSubControls > .select-wrap-sm,
.articulation-sub-row#rhythmSubControls > .select-wrap-sm{
  flex:1 1 0;
  width:auto !important;
  min-width:0;
}
.articulation-sub-row#rhythmSubControls{
  justify-content:flex-start;
  padding-right:2px;
}
.articulation-sub-row#arpeggioSubControls > [data-for="arpeggioTempo"],
.articulation-sub-row#rhythmSubControls > [data-for="rhythmTempo"]{
  margin-left:0;
}

.instrument-rows{
  display:flex;
  flex-direction:column;
  gap:4px;
  flex-shrink:0;
}
.inst-row{
  display:flex;
  align-items:center;
  gap:8px;
  height:22px;
}
.inst-row-label{
  font-size:10px;
  font-weight:700;
  color:#8e8e93;
  text-transform:uppercase;
  width:42px;
  flex-shrink:0;
}

.knob-container{
  display:flex;
  align-items:center;
  gap:4px;
  cursor:pointer;
  user-select:none;
  transition: opacity 0.2s;
}
.knob{
  width:20px;
  height:20px;
  border-radius:50%;
  background:#2c2c2e;
  border:1px solid #3a3a3c;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}
.knob-indicator{
  width:2px;
  height:8px;
  background:#f2f2f7;
  position:absolute;
  top:1px;
  border-radius:1px;
  transform-origin:bottom center;
  transform:rotate(0deg);
}
.knob-label{
  font-size:9px;
  color:#8e8e93;
  text-transform:uppercase;
}

.chord-sections{
  display:flex;
  flex-direction:column;
  gap:var(--chord-spacing);
  container-type: inline-size;
}
.section{display:flex;flex-direction:row;align-items:stretch;width:100%;}
.chords{display:grid;grid-template-columns:repeat(12, 1fr);gap:4px;flex:1;width:100%;}

.chord{
  border:1px solid #2c2c2e;background:#1c1c1e;color:#d1d1d6;border-radius:12px;
  aspect-ratio: 1 / 1; padding:2px; cursor:pointer;position:relative;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  width:100%;touch-action:manipulation;
}
.chord-name{font-weight:700;font-size:12px;color:#f2f2f7}
.chord-roman{
  position:absolute;top:3px;right:5px;font-size:9px;font-weight:700;
  color:rgba(255,255,255,0.85);pointer-events:none;
}
.chord-inversion{
  position:absolute;bottom:3px;right:5px;font-size:9px;font-weight:700;
  color:rgba(255,255,255,0.75);pointer-events:none;
}

#lowerArea {
  display: flex;
  flex-direction: column;
  gap: 0;
  margin-top:var(--chord-spacing);
  width: 100%;
  flex: 1;
  min-height: 0;
}
#chordArea{flex:0 0 auto;}
.piano-wrap{
  display:flex;
  gap:0;
  width:100%;
  flex:1;
  min-height:0;
  background:#1c1c1e;
  border:1px solid #2c2c2e;
  border-radius:10px;
  padding:0; 
  box-sizing:border-box;
  overflow:hidden;
  touch-action:none; 
}
.piano-key{
  flex:1 1 0;
  min-width:0;
  width:0;
  height:100%;
  border:0;
  border-right:0;
  border-radius:0;
  background:#1c1c1e;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding-top: 10px;
  cursor:pointer;
  user-select:none;
  transform-origin: center center;
  transition:background 0.08s, transform 0.05s;
}
.piano-key:hover, .piano-key.drag-hover{
  background:#2c2c2e;
}
.piano-key.played{
  background:#3a3a3c !important;
}
.piano-key:not(:last-child){border-right:1px solid #2c2c2e;}
.piano-key.is-black{
  background:#111113;
}
.piano-key-text{
  font-size:11px;
  font-weight:800;
  line-height:1;
  padding-top: 4px;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.1s;
}
.piano-key.has-note .piano-key-text{
  opacity:1;
}

.adv-chords-wrap{
  display:flex;
  flex-direction:column;
  gap:8px;
  width:100%;
  flex:1;
  min-height:0;
}
.adv-chords-wrap .section {
  flex: 1;
}
.adv-chords-wrap .chords {
  flex: 1;
}
.adv-chords-wrap .chord {
  height: 100%;
  aspect-ratio: auto;
}

.harp-container{
  background:#1c1c1e;border:1px solid #2c2c2e;border-radius:12px;
  overflow:hidden;touch-action:none;display:flex;flex-direction:column;flex:1;
}
.harp-grid{flex:1;display:grid;grid-template-rows:repeat(12,1fr);position:relative;}
.harp-lane{
  position:relative;border:0;border-bottom:1px solid #2c2c2e;
  background:#1c1c1e;
  transform-origin: center center;
  transition:background .08s, transform .05s;
}
.harp-lane:last-child{border-bottom:0}
.harp-lane:hover{background:#2c2c2e}
.harp-lane.played{background:#3a3a3c}

@media (min-aspect-ratio: 1/1) {
  .app{
    padding-top:104px;
  }
  .center-content{
    height:476px;
    min-height:476px;
  }
  .top-toolbar{
    position:absolute;
    top:-104px;
    left:0;
    width:1160px;
  }
  .vertical-harp{
    height:476px;
    min-height:476px;
  }
}

@media (max-aspect-ratio: 1/1) {
  .app{
    width:984px;
    min-width:984px;
    max-width:984px;
    height:756px;
    min-height:756px;
    max-height:756px;
    flex-direction:column;
  }
  .center-content{
    flex:0 0 580px;
    width:984px;
    min-width:984px;
    height:580px;
    gap:0;
  }
  .center-content > #chordArea{
    margin-top:var(--panel-spacing);
  }
  .top-toolbar{
    padding-left:10px;
    padding-right:10px;
    gap:4px;
  }
  .toolbar-divider{
    margin-left:2px;
    margin-right:2px;
  }
  .info-compact{
    width:80px;
    min-width:80px;
  }
  .selectors-stack{
    width:160px;
    min-width:160px;
  }
  .selectors-desktop > div:first-child{
    gap:2px !important;
  }
  .selectors-desktop > div:first-child > .select-wrap-sm:last-child{
    width:90px !important;
    flex:0 0 90px !important;
  }
  .articulation-section{
    width:220px;
  }
  .instrument-rows .select-wrap-sm{
    width:100px !important;
  }
  .vertical-harp{
    width:984px;
    min-width:984px;
    height:160px;
    min-height:160px;
    flex:0 0 160px;
  }
  .harp-grid{
    grid-template-columns:repeat(12,1fr);
    grid-template-rows:1fr;
  }
  .harp-lane{
    border-bottom:0;
    border-right:1px solid #2c2c2e;
  }
  .harp-lane:last-child{
    border-right:0;
  }
}

</style>
</head>
<body>
<div style="display:none;">
  <input id="chordVolume" type="range" min="0" max="100" value="20">
  <input id="harpVolume" type="range" min="0" max="100" value="30">
  <input id="pianoVolume" type="range" min="0" max="100" value="30">
  <input id="chordRelease" type="range" min="0.15" max="5" step="0.05" value="0.6">
  <input id="harpRelease" type="range" min="0.15" max="5" step="0.05" value="1.15">
  <input id="pianoRelease" type="range" min="0.15" max="5" step="0.05" value="1.15">
  <input id="arpeggioTempo" type="range" min="100" max="380" value="180">
  <input id="rhythmTempo" type="range" min="60" max="240" value="120">
  <input id="rhythmSubVolume" type="range" min="0" max="100" value="70">
</div>

<div class="app-wrapper">
<div class="app" id="appContainer">
  <div class="center-content" id="centerContent">
    <div class="top-toolbar">
      <button class="controls-btn" id="menuBtn" aria-label="Menu" data-info="Menu">
        <img id="menuIcon" src="menu.svg" alt="" aria-hidden="true">
      </button>
      <div class="menu-dropdown collapsed" id="menuDropdown">
        <button type="button" id="refreshBtn">Refresh</button>
      </div>
      <button class="controls-btn rec-btn" id="recordToggle" aria-label="Record MIDI" data-info="Record MIDI">
        <img class="record-icon" src="record.svg" alt="" aria-hidden="true">
        <img class="stop-icon" src="stop.svg" alt="" aria-hidden="true">
      </button>

      <button class="controls-btn active" id="advBtn" aria-label="Show piano" data-info="Show piano">
        <img class="piano-icon" src="piano.svg" alt="" aria-hidden="true">
        <img class="chord-grid-icon" src="morechords.svg" alt="" aria-hidden="true">
      </button>

      <div class="info-compact">
        <div class="current" id="current">C Major</div>
        <div class="notes" id="notes">C · E · G</div>
      </div>

      <div class="toolbar-divider"></div>

      <div class="selectors-stack">
        <div class="selectors-desktop">
          <div style="display:flex; gap:4px; width:100%; align-items:center;">
            <div class="select-wrap-sm" id="keySelectWrap" style="flex:1;">
              <label for="keySelect">key</label>
              <select id="keySelect"></select>
            </div>
            <div class="select-wrap-sm" style="width:125px;">
              <label for="modeSelect">mode</label>
              <select id="modeSelect"></select>
            </div>
          </div>
          <div style="display:flex; gap:4px; width:100%; align-items:center;">
            <button type="button" class="chromatic-highlight-ctrl-btn" id="advHighlightBtn" style="flex:1;">+ Highlight</button>
            <button type="button" class="chromatic-highlight-ctrl-btn" id="voicingBtn" style="flex:1; display:none;">Voicing: Default</button>
          </div>
        </div>
      </div>

      <div class="toolbar-divider"></div>

      <div class="articulation-section">
        <div class="select-wrap-sm" style="width:100%;">
          <label for="chordPicker">articulation</label>
          <select id="chordPicker">
            <option value="staccato">Staccato</option>
            <option value="sustain" selected>Sustain</option>
            <option value="legato">Legato</option>
            <option value="arpeggio">Arpeggio</option>
            <option value="rhythm">Rhythm</option>
          </select>
        </div>

        <div class="articulation-sub-row" id="arpeggioSubControls" style="display:none;">
          <div class="select-wrap-sm" style="width:110px; flex-shrink:0;">
            <label for="arpeggioStyleSelect">style</label>
            <select id="arpeggioStyleSelect">
              <option value="up" selected>Up</option>
              <option value="down">Down</option>
              <option value="pendulum">Pendulum</option>
            </select>
          </div>
          <button type="button" class="chromatic-highlight-ctrl-btn" id="arpeggioPaddingToggle" aria-pressed="false">Strict</button>
          <div class="knob-container" data-for="arpeggioTempo" style="flex-shrink:0;">
            <div class="knob" style="width:18px;height:18px;"><div class="knob-indicator"></div></div>
            <span class="knob-label">BPM</span>
          </div>
        </div>

        <div class="articulation-sub-row" id="rhythmSubControls" style="display:none;">
          <div class="select-wrap-sm" style="width:160px; flex-shrink:0;">
            <label for="rhythmSelect">style</label>
            <select id="rhythmSelect">
              <option value="8beat">8-Beat</option>
              <option value="16beat">16-Beat</option>
              <option value="waltz">Waltz</option>
              <option value="bossanova">Bossa Nova</option>
              <option value="rock">Rock</option>
              <option value="disco">Disco</option>

function recordMidiEvent(status, note, velocity, channel = 0, sessId = -1) {
  if (!isRecording) return;
  if (sessId !== -1 && sessId !== recordSessionId) return;
  const timeMs = Math.max(0, performance.now() - recordStartTime);
  recordedEvents.push({ timeMs, status, note, velocity, channel });
}

function writeVarLen(val) {
  let buffer = [];
  let v = val;
  buffer.push(v & 0x7F);
  while ((v >>= 7) > 0) {
    buffer.unshift((v & 0x7F) | 0x80);
  }
  return buffer;
}

function buildMidiBlob(events) {
  const PPQN = 480;
  const BPM = 120;
  let tracksData = [];

  function createTrack(trackEvents, trackName) {
    let trackBytes = [];
    if (trackName) {
      trackBytes.push(0x00, 0xFF, 0x03, trackName.length);
      for (let i = 0; i < trackName.length; i++) {
        trackBytes.push(trackName.charCodeAt(i));
      }
    }

    trackEvents.sort((a, b) => a.timeMs - b.timeMs);
    let lastTicks = 0;
    trackEvents.forEach(e => {
      let currentTicks = Math.round((e.timeMs * PPQN * (BPM / 60)) / 1000);
      let deltaTicks = Math.max(0, currentTicks - lastTicks);
      lastTicks = currentTicks;

      trackBytes.push(...writeVarLen(deltaTicks));
      const channelStatus = (e.status & 0xF0) | (e.channel & 0x0F);
      trackBytes.push(channelStatus, e.note, e.velocity);
    });

    trackBytes.push(0x00, 0xFF, 0x2F, 0x00);

    let trackLen = trackBytes.length;
    return [
      0x4D, 0x54, 0x72, 0x6B,
      (trackLen >> 24) & 0xFF, (trackLen >> 16) & 0xFF,
      (trackLen >> 8) & 0xFF, trackLen & 0xFF,
      ...trackBytes
    ];
  }

  let track0Bytes = [
    0x00, 0xFF, 0x51, 0x03, 0x07, 0xA1, 0x20,
    0x00, 0xFF, 0x2F, 0x00
  ];
  let track0Len = track0Bytes.length;
  tracksData.push(...[
    0x4D, 0x54, 0x72, 0x6B,
    (track0Len >> 24) & 0xFF, (track0Len >> 16) & 0xFF,
    (track0Len >> 8) & 0xFF, track0Len & 0xFF,
    ...track0Bytes
  ]);

  const chordsEvents = events.filter(e => e.channel === 0);
  const harpEvents = events.filter(e => e.channel === 1);
  const pianoEvents = events.filter(e => e.channel === 2);

  tracksData.push(...createTrack(chordsEvents, "Chords"));
  tracksData.push(...createTrack(harpEvents, "Harp"));
  tracksData.push(...createTrack(pianoEvents, "Piano"));

  const numTracks = 4;
  let headerChunk = [
    0x4D, 0x54, 0x68, 0x64,
    0x00, 0x00, 0x00, 0x06,
    0x00, 0x01,
    (numTracks >> 8) & 0xFF, numTracks & 0xFF,
    (PPQN >> 8) & 0xFF, PPQN & 0xFF
  ];

  const fullBuffer = new Uint8Array([...headerChunk, ...tracksData]);
  return new Blob([fullBuffer], { type: "audio/midi" });
}

function stopAllPlayback(immediate = false) {
  if (!audio) return;
  const now = audio.ctx.currentTime;
  activeAudioNodes.forEach(node => {
    try {
      node.gain.gain.cancelScheduledValues(now);
      if (immediate) {
        node.gain.gain.setValueAtTime(0, now);
        node.osc.stop(now + 0.01);
      } else {
        node.gain.gain.linearRampToValueAtTime(0.0001, now + 0.05);
        node.osc.stop(now + 0.1);
      }
    } catch(e) {}
  });
  activeAudioNodes.clear();
  
  stopSustain(immediate);
  stopRhythm();
  stopArpeggio();
}

function getChordWave(){ return document.getElementById("chordWave")?.value || "square"; }
function getHarpWave(){ return document.getElementById("harpWave")?.value || "square"; }

function getHarpRelease(){ return Number(document.getElementById("harpRelease").value); }
function getPianoRelease(){ return Number(document.getElementById("pianoRelease").value); }

function chordDef(type){
  let def = CHORD_TYPES.find(c => c.id === type) || ADV_CHORD_TYPES.find(c => c.id === type);
  return def || CHORD_TYPES[0];
}

function label(root, type){
  return NOTES[root] + chordDef(type).suffix;
}

function getFullChordName(root, type){
  const rootName = NOTES[root];
  if(type === "major") return rootName + " Major";
  if(type === "minor") return rootName + " Minor";
  if(type === "7") return rootName + " Dominant 7th";
  if(type === "diminished") return rootName + " Diminished";
  if(type === "augmented") return rootName + " Augmented";
  if(type === "sus4") return rootName + " Sus4";
  if(type === "add9") return rootName + " Add9";
  if(type === "maj7") return rootName + " Major 7th";
  if(type === "m7") return rootName + " Minor 7th";
  return label(root, type);
}

function computeVoicingForChord(root, type) {
  const intervals = chordDef(type).intervals;
  const N = intervals.length;

  if (voicingMode !== "voiceleading" || selectedMode === "chromatic" || selectedKey === null) {
    const midiNotes = intervals.map(i => 60 + root + i);
    return { midiNotes, inversion: 0 };
  }

  if (root === selectedKey) {
    const midiNotes = intervals.map(i => 60 + root + i);
    return { midiNotes, inversion: 0 };
  }

  const rootQuality = MODES[selectedMode]?.qualities[0] || "major";
  const rootIntervals = chordDef(rootQuality).intervals;
  const anchorMidiCenter = 60 + selectedKey + (rootIntervals.reduce((a, b) => a + b, 0) / rootIntervals.length);

  const pitchClasses = intervals.map(i => (root + i) % 12);

  let bestInversion = 0;
  let bestMidiNotes = [];
  let minDiff = Infinity;

  for (let k = 0; k < N; k++) {
    const bassPc = pitchClasses[k];
    let naiveBass = 60 + bassPc;
    if (naiveBass >= 72) naiveBass -= 12;

    let currentNotes = [naiveBass];
    for (let j = 1; j < N; j++) {
      const currPc = pitchClasses[(k + j) % N];
      const prevPc = pitchClasses[(k + j - 1) % N];
      let step = (currPc - prevPc + 12) % 12;
      if (step === 0) step = 12;
      currentNotes.push(currentNotes[j - 1] + step);
    }

    let avg = currentNotes.reduce((a, b) => a + b, 0) / N;
    let octaveShift = Math.round((anchorMidiCenter - avg) / 12);
    currentNotes = currentNotes.map(n => n + octaveShift * 12);
    
    avg = currentNotes.reduce((a, b) => a + b, 0) / N;
    const diff = Math.abs(avg - anchorMidiCenter);

    if (diff < minDiff) {
      minDiff = diff;
      bestInversion = k;
      bestMidiNotes = currentNotes;
    }
  }

  return { midiNotes: bestMidiNotes, inversion: bestInversion };
}

function getChordVoicedMidi(root, type) {
  return computeVoicingForChord(root, type).midiNotes;
}

function notesFor(root, type){
  const midiNotes = getChordVoicedMidi(root, type);
  return midiNotes.map(m => NOTES[m % 12]);
}

function formatControlValue(inputId, val) {
  if (inputId.includes("Volume")) {
    return `Vol: ${Math.round(val)}%`;
  } else if (inputId.includes("Release")) {
    return `Decay: ${Number(val).toFixed(2)}s`;
  } else if (inputId.includes("Tempo")) {
    return `Tempo: ${Math.round(val)} BPM`;
  }
  return `${val}`;
}

function titleCase(text) {

}

function showChordInfo() {
  const voicingInfo = computeVoicingForChord(currentRoot, currentType);

    nameStr += " / " + bassNote;

  document.getElementById("current").textContent = titleCase(nameStr);
  document.getElementById("notes").textContent = voicingInfo.midiNotes.map(m => NOTES[m % 12]).join(" · ");
}

function showHoveredInfo(element) {
  if (element.matches(".knob-container")) {
    const input = document.getElementById(element.dataset.for);
    if (input) showKnobInfo(element.dataset.for, Number(input.value));
    return;
  }

  if (element.matches(".chord")) {
    const chordInfo = computeVoicingForChord(Number(element.dataset.root), element.dataset.type);
    document.getElementById("current").textContent = titleCase(getFullChordName(Number(element.dataset.root), element.dataset.type));
    document.getElementById("notes").textContent = chordInfo.midiNotes.map(m => NOTES[m % 12]).join(" · ");
    return;
  }

  if (element.matches("select")) {
    showSelectInfo(element);
    return;
  }

  if (element.matches("button")) {
    const info = element.dataset.info || element.getAttribute("aria-label") || element.title || element.textContent.trim() || "Button";
    document.getElementById("current").textContent = titleCase(info);
    document.getElementById("notes").textContent = "";
  }
}

function initInfoHover() {

      showOptionInfo(e.target);
      return;

    const element = e.target.closest(".knob-container, .chord, select, button");
    if (!element || element.matches(".knob-container") && e.relatedTarget?.closest?.(".knob-container") === element) return;
    showHoveredInfo(element);
  });

  document.addEventListener("mouseover", e => {
    if (e.target.matches("option")) showOptionInfo(e.target);
  });

  document.addEventListener("pointerout", e => {
    const element = e.target.closest(".knob-container, .chord, select, button");
    if (!element || element.contains(e.relatedTarget)) return;
    showChordInfo();
  });

  document.addEventListener("change", e => {
    if (e.target.matches("select") && e.target.matches(":hover")) {
      showSelectInfo(e.target);

function initKnobs() {
  document.querySelectorAll('.knob-container').forEach(container => {
    const inputId = container.dataset.for;
    const input = document.getElementById(inputId);
    const indicator = container.querySelector('.knob-indicator');
    if (!input || !indicator) return;

    function updateKnobVisual() {
      const min = Number(input.min);
      const max = Number(input.max);
      const val = Number(input.value);
      const pct = (val - min) / (max - min);
      const deg = -135 + pct * 270;
      indicator.style.transform = `rotate(${deg}deg)`;
    }

    updateKnobVisual();
    container.addEventListener('pointerenter', () => {
      showKnobInfo(inputId, Number(input.value));
    });
    container.addEventListener('pointerleave', showChordInfo);

    let dragging = false;
    let startY = 0;
    let startVal = 0;

    container.addEventListener('pointerdown', e => {
      e.preventDefault();
      dragging = true;
      container.classList.add('dragging');
      startY = e.clientY;
      startVal = Number(input.value);
      container.setPointerCapture?.(e.pointerId);
    });

    container.addEventListener('pointermove', e => {
      if (!dragging) return;
      const dy = startY - e.clientY;
      const min = Number(input.min);
      const max = Number(input.max);
      const range = max - min;
      
      let newVal = startVal + (dy / 100) * range;
      newVal = Math.max(min, Math.min(max, newVal));
      
      input.value = newVal;
      updateKnobVisual();
      showKnobInfo(inputId, newVal);
      input.dispatchEvent(new Event('input'));
    });

    input.addEventListener('input', () => {
      updateKnobVisual();
      if (container.matches(':hover')) showKnobInfo(inputId, Number(input.value));
    });

    const endDrag = e => {
      if (dragging) {
        dragging = false;
        container.classList.remove('dragging');
      }
    };
    container.addEventListener('pointerup', endDrag);
    container.addEventListener('pointercancel', endDrag);
  });
  updateChordDecayState();
  updatePianoSettingsState();
}

function handleChordPlay(isSame) {
  if (!ensureAudioReady()) return;
  if (chordPicker === "rhythm") {
    stopSustain();
    stopArpeggio();
    if (isSame && rhythmRunning) {
      stopRhythm();
      updateInfo(false);
    } else {
      startRhythm();
      updateInfo(true);
    }
    return;
  }
  if (chordPicker === "arpeggio") {
    stopSustain();
    stopRhythm();
    if (isSame && arpeggioRunning) {
      stopArpeggio();
      updateInfo(false);
    } else {
      startArpeggio();
      updateInfo(true);
    }
    return;
  }
  stopRhythm();
  stopArpeggio();
  if (chordPicker === "sustain" || chordPicker === "legato") {
    if (isSame && sustainActive) {
      stopSustain();
      updateInfo(false);
    } else {
      startSustain();
      updateInfo(true);
    }
  } else {
    stopSustain();
    updateInfo(true);
    playChordIntervals(getChordVoicedMidi(currentRoot, currentType));
  }
}

function lightenHex(hex, amount = 40) {
  let c = hex.replace('#','');
  if(c.length === 3) c = c.split('').map(x => x + x).join('');
  const num = parseInt(c, 16);
  const r = Math.min(255, ((num >> 16) & 255) + amount);
  const g = Math.min(255, ((num >> 8) & 255) + amount);
  const b = Math.min(255, (num & 255) + amount);
  return `#${((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1)}`;
}

function applyScaleHighlights(){
  document.querySelectorAll(".chord-roman, .chord-inversion").forEach(el => el.remove());

  let colorMap = null;

  if(selectedMode !== "chromatic" && selectedKey !== null) {
    const modeDef = MODES[selectedMode];
    const degreeColors = ["#D33682","#CB4B16","#B58900","#859900","#2AA198","#268BD2","#6C71C4"];
    const romanNumeralsBase = ["I", "II", "III", "IV", "V", "VI", "VII"];
    colorMap = new Map();
    const romanMap = new Map();

    const scalePitchClasses = new Set(modeDef.intervals.map(i => (selectedKey + i) % 12));
    const rootToDegreeIdx = new Map();

    modeDef.intervals.forEach((interval, idx) => {
      const scaleRoot = (selectedKey + interval) % 12;
      rootToDegreeIdx.set(scaleRoot, idx);

      const diatonicQuality = modeDef.qualities[idx];
      let roman = romanNumeralsBase[idx];
      if(diatonicQuality === "minor") roman = roman.toLowerCase();
      if(diatonicQuality === "diminished") roman = roman.toLowerCase() + "°";
      romanMap.set(`${scaleRoot}-${diatonicQuality}`, roman);
    });

    const allTypes = [...CHORD_TYPES, ...ADV_CHORD_TYPES];
    for(let r = 0; r < 12; r++) {
      if (!rootToDegreeIdx.has(r)) continue;

      const degreeIdx = rootToDegreeIdx.get(r);
      const color = degreeColors[degreeIdx];

      allTypes.forEach(t => {
        const isDiatonic = t.intervals.every(i => scalePitchClasses.has((r + i) % 12));
        if (isDiatonic) {
          colorMap.set(`${r}-${t.id}`, color);
        }
      });
    }

    document.querySelectorAll(".chord").forEach(b=>{
      const br = Number(b.dataset.root);
      const bt = b.dataset.type;
      const roman = romanMap.get(`${br}-${bt}`);
      
      if(roman){
        const romanSpan = document.createElement("span");
        romanSpan.className = "chord-roman";
        romanSpan.textContent = roman;
        b.appendChild(romanSpan);
      }
    });
  }

  document.querySelectorAll(".chord").forEach(b => {
    const br = Number(b.dataset.root);
    const bt = b.dataset.type;
    const vInfo = computeVoicingForChord(br, bt);
    
    if (vInfo.inversion > 0) {
      const invSpan = document.createElement("span");
      invSpan.className = "chord-inversion";
      const invText = vInfo.inversion === 1 ? "1st" : (vInfo.inversion === 2 ? "2nd" : "3rd");
      invSpan.textContent = invText;
      b.appendChild(invSpan);
    }
  });

  highlightActiveChord(colorMap);
  updatePianoHighlights();
}

function initAudio(){
  const Ctx=window.AudioContext||window.webkitAudioContext;
  if(!Ctx||audio)return;
  let ctx;
  try {
    ctx = new Ctx({ latencyHint: "interactive" });
  } catch (err) {
    console.warn("Audio context initialization with latency hint failed:", err);
    ctx = new Ctx();
  }
  const master=ctx.createGain();
  master.gain.value = 1.0;
  master.connect(ctx.destination);
  audio={ctx,master};
}
function resumeAudio(){
  if (audio?.ctx.state === "closed") {
    audio = null;
    audioResumePromise = null;
    audioWarmupStarted = false;
  }
  initAudio();
  if (audio?.ctx.state === "suspended" && !audioResumePromise) {
    audioResumePromise = audio.ctx.resume()
      .catch(err => {
        console.warn("Audio context resume failed:", err);
        return false;
      })
      .finally(() => {
        audioResumePromise = null;
      });
  }
  return audio;
}

function warmAudioOutput(){
  const currentAudio = resumeAudio();
  if (!currentAudio || audioWarmupStarted) return currentAudio;
  audioWarmupStarted = true;
  const now = currentAudio.ctx.currentTime;
  const oscillator = currentAudio.ctx.createOscillator();
  const gain = currentAudio.ctx.createGain();
  gain.gain.setValueAtTime(0, now);
  oscillator.connect(gain);
  gain.connect(currentAudio.master);
  oscillator.start(now);
  oscillator.stop(now + 0.02);
  return currentAudio;
}

function ensureAudioReady(){
  const currentAudio = warmAudioOutput();
  if (!currentAudio) return null;
  return currentAudio;
}
function midiFreq(m){return 440*Math.pow(2,(m-69)/12)}

function playTone(midi, volume=.13, dest, waveType="square", decayTime=.25, scheduledTime=null, channel=0){
  if(!audio || audio.ctx.state === "closed") return null;
  const o = audio.ctx.createOscillator(), g = audio.ctx.createGain();
  const t = (scheduledTime !== null && scheduledTime >= audio.ctx.currentTime) ? scheduledTime : audio.ctx.currentTime;
  o.type = ["sine","square","sawtooth","triangle"].includes(waveType) ? waveType : "square";
  o.frequency.value = midiFreq(midi);
  
  g.gain.setValueAtTime(.0001, t);
  g.gain.linearRampToValueAtTime(Math.max(.0001,volume), t+.005);
  
  const totalDuration = 0.005 + Math.max(0.01, decayTime);
  g.gain.exponentialRampToValueAtTime(.0001, t + totalDuration);
  
  o.connect(g);g.connect(dest||audio.master);
  o.start(t);o.stop(t+totalDuration+.05);

  const nodeObj = { osc: o, gain: g };
  activeAudioNodes.add(nodeObj);
  setTimeout(() => activeAudioNodes.delete(nodeObj), (totalDuration + .1) * 1000);

  const delayMs = Math.max(0, Math.round((t - audio.ctx.currentTime) * 1000));
  const currentSess = recordSessionId;
  setTimeout(() => {
    recordMidiEvent(0x90, midi, 100, channel, currentSess);
    setTimeout(() => recordMidiEvent(0x80, midi, 0, channel, currentSess), Math.round(totalDuration * 1000));
  }, delayMs);

  return {osc:o,gain:g};
}

function startRhythm() {
  if (!audio) resumeAudio();
  if (rhythmRunning) return;
  rhythmRunning = true;
  rhythmCurrentStep = 0;
  rhythmNextNoteTime = audio.ctx.currentTime;
  rhythmScheduler();
}

function stopRhythm() {
  rhythmRunning = false;
  if (rhythmTimerId) {
    clearTimeout(rhythmTimerId);
    rhythmTimerId = null;
  }
}

function rhythmScheduler() {
  if (!rhythmRunning) return;
  while (rhythmNextNoteTime < audio.ctx.currentTime + 0.1) {
    scheduleRhythmStep(rhythmCurrentStep, rhythmNextNoteTime);
    nextRhythmStep();
  }
  rhythmTimerId = setTimeout(rhythmScheduler, 25);
}

function nextRhythmStep() {
  const tempo = Number(document.getElementById("rhythmTempo")?.value || 120);
  const secondsPerBeat = 60 / tempo;
  const style = document.getElementById("rhythmSelect")?.value || "8beat";
  let stepDiv = 4;
  if (style === "waltz") stepDiv = 3;
  if (style === "8beat" || style === "swing") stepDiv = 2;
  if (style === "takefive") stepDiv = 1;
  if (style === "kalamatianos" || style === "shuffle") stepDiv = 2;
  const secondsPerStep = secondsPerBeat / stepDiv;
  
  const pattern = RHYTHM_PATTERNS[style] || RHYTHM_PATTERNS["8beat"];
  rhythmNextNoteTime += secondsPerStep;
  rhythmCurrentStep = (rhythmCurrentStep + 1) % pattern.steps;
}

function scheduleRhythmStep(step, time) {
  const style = document.getElementById("rhythmSelect")?.value || "8beat";
  const pattern = RHYTHM_PATTERNS[style] || RHYTHM_PATTERNS["8beat"];
  const event = pattern.events[step];
  if (!event) return;

  const voicedMidi = getChordVoicedMidi(currentRoot, currentType);
  const bassBase = 36 + currentRoot;
  const chordWave = getChordWave();
  const chordVolFactor = Number(document.getElementById("chordVolume").value)/100;
  const subVolFactor = Number(document.getElementById("rhythmSubVolume")?.value || 70)/100;
  const decay = Math.min(getChordRelease(), 0.4);

  if (event.bass) {
    let bassMidi = bassBase;
    if (event.bass === "5th") bassMidi += 7;
    const bassVol = (event.accent ? 0.22 : 0.16) * subVolFactor;
    playTone(bassMidi, bassVol, null, "sawtooth", decay, time, 0);
  }

  if (event.chord) {
    const chordVol = (event.accent ? 0.16 : 0.11) * chordVolFactor;
    voicedMidi.forEach(midi => {
      playTone(midi, chordVol, null, chordWave, decay, time, 0);
    });
  }
}

function startArpeggio() {
  if (!audio) resumeAudio();
  if (arpeggioRunning) return;
  arpeggioRunning = true;
  arpeggioCurrentStep = 0;
  arpeggioNextNoteTime = audio.ctx.currentTime;
  arpeggioScheduler();
}

function stopArpeggio() {
  arpeggioRunning = false;
  if (arpeggioTimerId) {
    clearTimeout(arpeggioTimerId);
    arpeggioTimerId = null;
  }
}

function arpeggioScheduler() {
  if (!arpeggioRunning) return;
  while (arpeggioNextNoteTime < audio.ctx.currentTime + 0.1) {
    scheduleArpeggioStep(arpeggioNextNoteTime);
    nextArpeggioStep();
  }
  arpeggioTimerId = setTimeout(arpeggioScheduler, 25);
}

function nextArpeggioStep() {
  const tempo = Number(document.getElementById("arpeggioTempo")?.value || 120);
  const secondsPerStep = 60 / (tempo * 2);
  arpeggioNextNoteTime += secondsPerStep;
}

function getArpeggioIndices(numNotes, style) {
  if (numNotes <= 1) return [0];
  if (style === "up") {
    let arr = [];
    for (let i = 0; i < numNotes; i++) arr.push(i);
    return arr;
  } else if (style === "down") {
    let arr = [];
    for (let i = numNotes - 1; i >= 0; i--) arr.push(i);
    return arr;
  } else {
    let arr = [];
    for (let i = 0; i < numNotes; i++) arr.push(i);
    for (let i = numNotes - 2; i > 0; i--) arr.push(i);
    return arr;
  }
}

function updateArpeggioPaddingState() {
  const styleSelect = document.getElementById("arpeggioStyleSelect");
  const paddingToggle = document.getElementById("arpeggioPaddingToggle");
  if (!styleSelect || !paddingToggle) return;
  const disabled = styleSelect.value === "pendulum";
  paddingToggle.disabled = disabled;
  paddingToggle.textContent = arpeggioWidePadding ? "Padding" : "Strict";
  paddingToggle.setAttribute("aria-pressed", String(arpeggioWidePadding));
  paddingToggle.className = arpeggioWidePadding
    ? "chromatic-highlight-ctrl-btn voicing-state"
    : "chromatic-highlight-ctrl-btn";
  paddingToggle.style.opacity = disabled ? "0.3" : "1";
  paddingToggle.style.pointerEvents = disabled ? "none" : "auto";
}

function scheduleArpeggioStep(time) {
  const voicedMidi = getChordVoicedMidi(currentRoot, currentType);
  const style = document.getElementById("arpeggioStyleSelect")?.value || "up";
  const indices = getArpeggioIndices(voicedMidi.length, style);
  const paddingEnabled = style !== "pendulum" && voicedMidi.length === 3 && arpeggioWidePadding;
  const sequenceLength = indices.length + (paddingEnabled ? 1 : 0);
  const sequenceStep = arpeggioCurrentStep % sequenceLength;
  const idx = indices[sequenceStep];
  arpeggioCurrentStep++;

  let midi = voicedMidi[idx];
  if (paddingEnabled && sequenceStep === indices.length) {
    const firstMidi = voicedMidi[indices[0]];
    const octaveOffset = arpeggioWidePadding
      ? (style === "down" ? -12 : 12)
      : 0;
    midi = firstMidi + octaveOffset;
  }
  const activeWave = getChordWave();
  const chordVolFactor = Number(document.getElementById("chordVolume").value)/100;
  const vol = 0.18 * chordVolFactor;
  const decay = Math.min(getChordRelease(), 0.5);

  playTone(midi, vol, null, activeWave, decay, time, 0);
}

function stopSustain(immediate = false){
  if(!audio)return;
  const now=audio.ctx.currentTime;
  sustainNodes.forEach(n=>{
    try{
      n.gain.gain.cancelScheduledValues(now);
      if (immediate) {
        n.gain.gain.setValueAtTime(0, now);
        n.osc.stop(now + 0.01);
      } else {
        n.gain.gain.setValueAtTime(n.gain.gain.value,now);
        n.gain.gain.exponentialRampToValueAtTime(.0001,now+.1);
        n.osc.stop(now+.15);
      }
    }catch(e){}
  });

  if (isRecording && sustainMidiNotes.length > 0) {
    sustainMidiNotes.forEach(m => recordMidiEvent(0x80, m, 0, 0, recordSessionId));
    sustainMidiNotes = [];
  }

  sustainNodes=[];
  sustainActive=false;
}

function getSustainVoices() {
  const midiNotes = getChordVoicedMidi(currentRoot, currentType);
  if (midiNotes.length === 3) return [...midiNotes, midiNotes[0] + 12];
  return midiNotes;
}

function startSustain(){
  if(chordPicker === "rhythm" || chordPicker === "arpeggio") return;
  if(!audio) resumeAudio();
  const midiNotes = getSustainVoices();
  const now=audio.ctx.currentTime;
  const activeWave = getChordWave();
  const chordVolFactor = Number(document.getElementById("chordVolume").value)/100;
  const peakVol = 0.16 * chordVolFactor;
  
  if (chordPicker === "legato" && sustainActive && sustainNodes.length === midiNotes.length) {
    if (isRecording && sustainMidiNotes.length > 0) {
      sustainMidiNotes.forEach(m => recordMidiEvent(0x80, m, 0, 0, recordSessionId));
    }
    sustainMidiNotes = midiNotes;
    if (isRecording) {
      sustainMidiNotes.forEach(m => recordMidiEvent(0x90, m, 100, 0, recordSessionId));
    }

    midiNotes.forEach((midi, idx) => {
      const freq = midiFreq(midi);
      sustainNodes[idx].osc.type = activeWave;
      sustainNodes[idx].osc.frequency.cancelScheduledValues(now);
      sustainNodes[idx].osc.frequency.setTargetAtTime(freq, now, 0.05);
    });
    return;
  }
  
  stopSustain();
  sustainMidiNotes = midiNotes;
  if (isRecording) {
    sustainMidiNotes.forEach(m => recordMidiEvent(0x90, m, 100, 0, recordSessionId));
  }

  midiNotes.forEach(midi => {
    const o=audio.ctx.createOscillator(),g=audio.ctx.createGain();
    o.type = activeWave;
    o.frequency.value=midiFreq(midi);
    g.gain.setValueAtTime(.0001,now);
    g.gain.exponentialRampToValueAtTime(peakVol,now+.005);
    o.connect(g);g.connect(audio.master);
    o.start(now);
    sustainNodes.push({osc:o,gain:g});
  });
  sustainActive=true;
}

function playChordIntervals(midiNotes){
  if(chordPicker === "rhythm" || chordPicker === "arpeggio") return;
  const activeWave = getChordWave();
  const chordVolFactor = Number(document.getElementById("chordVolume").value)/100;
  const vol = 0.18 * chordVolFactor;
  const decay = getChordRelease(); 

  if(chordPicker==="staccato"){
    midiNotes.forEach(midi=>playTone(midi, vol, null, activeWave, decay, null, 0));
  }
}

function getHarpIntervals(){
  const ints = chordDef(currentType).intervals;
  if (ints.length >= 4) {
    return [ints[0], ints[1], ints[3]];
  }
  return [ints[0], ints[1], ints[2]];
}

function playHarpNote(laneIndex){
  const intervals=getHarpIntervals(),group=Math.floor(laneIndex/3),tone=intervals[laneIndex%3];
  const midi=60+currentRoot+tone+(group*12)+((laneIndex%3===2)?-12:0);
  const activeHarpWave = getHarpWave();
  const harpVolFactor = Number(document.getElementById("harpVolume").value)/100;
  const vol = 0.14 * harpVolFactor;
  const decay = getHarpRelease();

  playTone(midi, vol, null, activeHarpWave, decay, null, 1);
  const lane=document.querySelector(`.harp-lane[data-lane="${laneIndex}"]`);
  if(lane){
    lane.classList.add("played");
    lane.style.transform = "scaleX(0.88)";
    setTimeout(()=>{
      lane.classList.remove("played");
      lane.style.transform = "none";
    },110);
  }
}

function renderHarp(){
  const grid=document.getElementById("harpGrid");
  if(!grid)return;
  grid.innerHTML="";
  for(let i=11;i>=0;i--){
    const lane=document.createElement("div");
    lane.className="harp-lane";
    lane.dataset.lane=i;
    grid.appendChild(lane);
  }
}

function syncHeights(){
  const centerEl = document.getElementById("centerContent");
  const harpSeg = document.getElementById("verticalHarpSegment");
  const chordArea = document.getElementById("chordArea");
  const recordDropdown = document.getElementById("recordDropdown");
  if(centerEl && harpSeg){
    harpSeg.style.height = centerEl.offsetHeight + "px";
  }
  if(chordArea){
    if(recordDropdown) recordDropdown.style.height = chordArea.offsetHeight + "px";
  }
}

function updateScaling(){
  const app = document.getElementById("appContainer");
  if(!app) return;
  const isPortrait = window.innerHeight > window.innerWidth;
  const baseWidth = isPortrait ? 984 : 1160;
  const baseHeight = isPortrait ? 756 : 580;
  const viewportWidth = window.visualViewport?.width || window.innerWidth;
  const viewportHeight = window.visualViewport?.height || window.innerHeight;
  const viewportInset = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--viewport-inset")) || 0;
  const viewportScale = Math.min(
    Math.max(1, viewportWidth - (viewportInset * 2)) / baseWidth,
    Math.max(1, viewportHeight - (viewportInset * 2)) / baseHeight
  );
  const scale = Math.min(1, viewportScale);

  app.style.transform = `scale(${scale})`;
}

function handlePointerDrag(e){
  const el=document.elementFromPoint(e.clientX,e.clientY);
  if(!el) return;

  const lane=el.closest(".harp-lane");
  if(!lane) return;

  const i=Number(lane.dataset.lane);
  if(!Number.isInteger(i) || i < 0 || i >= 12) return;

  const pointerId = e.pointerId;
  const last = harpPointerLanes.get(pointerId);
  if (last !== i) {
    if (last !== undefined && last !== -1) {
      const step = i > last ? 1 : -1;
      for (let n = last + step; n !== i; n += step) {
        if (n >= 0 && n < 12) playHarpNote(n);
      }
    }
    playHarpNote(i);
    harpPointerLanes.set(pointerId, i);
  }
}

const harpGridEl=document.getElementById("harpGrid");
harpGridEl.addEventListener("pointerdown",e=>{
  e.preventDefault();
  if (!ensureAudioReady()) return;
  harpDragging=true;
  activePointerId=e.pointerId;
  activeHarpPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  harpGridEl.setPointerCapture?.(e.pointerId);
  harpPointerLanes.set(e.pointerId, -1);
  handlePointerDrag(e);
});
harpGridEl.addEventListener("pointermove",e=>{
  if(harpDragging && activeHarpPointers.has(e.pointerId)){
    activeHarpPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    handlePointerDrag(e);
  }
});
function endHarp(e){
  if (e && typeof e.pointerId === "number") {
    activeHarpPointers.delete(e.pointerId);
    harpPointerLanes.delete(e.pointerId);
    if (activePointerId === e.pointerId) {
      activePointerId = null;
    }
  } else {
    activeHarpPointers.clear();
    harpPointerLanes.clear();
    activePointerId = null;
  }

  if (activeHarpPointers.size === 0) {
    harpDragging = false;
  }
}
document.addEventListener("pointerup",endHarp);document.addEventListener("pointercancel",endHarp);

function render(){
  renderSelectors();
  renderChromatic();
  updateInfo(sustainActive || rhythmRunning || arpeggioRunning || (chordPicker!=="sustain" && chordPicker!=="legato"));
}

const recordDropdown = document.getElementById("recordDropdown");
const recordToggle = document.getElementById("recordToggle");
const saveMidiBtn = document.getElementById("saveMidiBtn");
const discardMidiBtn = document.getElementById("discardMidiBtn");
const advBtn = document.getElementById("advBtn");
const menuBtn = document.getElementById("menuBtn");
const menuDropdown = document.getElementById("menuDropdown");
const refreshBtn = document.getElementById("refreshBtn");

menuBtn.addEventListener("click", e => {
  e.stopPropagation();
  menuDropdown.classList.toggle("collapsed");
});

refreshBtn.addEventListener("click", () => {
  window.location.reload();
});

recordToggle.addEventListener("click", (e) => {
  e.stopPropagation();
  stopAllPlayback();

  if (!isRecording) {
    recordDropdown.classList.add("collapsed");
    
    isRecording = true;
    recordSessionId++;
    recordStartTime = performance.now();
    recordedEvents = [];
    recordToggle.classList.add("recording");
    recordToggle.title = "Stop Recording";
    recordToggle.dataset.info = "Stop Recording";
    recordToggle.setAttribute("aria-label", "Stop Recording");
  } else {
    isRecording = false;
    recordToggle.classList.remove("recording");
    recordToggle.title = "Record MIDI";
    recordToggle.dataset.info = "Record MIDI";
    recordToggle.setAttribute("aria-label", "Record MIDI");
    
    if (sustainMidiNotes.length > 0) {
      sustainMidiNotes.forEach(m => recordMidiEvent(0x80, m, 0, 0, recordSessionId));
      sustainMidiNotes = [];
    }
    
    if (recordedEvents.length > 0) {
      recordDropdown.classList.remove("collapsed");
    }
  }
});

saveMidiBtn.addEventListener("click", () => {
  const blob = buildMidiBlob(recordedEvents);
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "omnichord_recording.mid";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  recordedEvents = [];
  recordDropdown.classList.add("collapsed");
});

discardMidiBtn.addEventListener("click", () => {
  recordedEvents = [];
  recordDropdown.classList.add("collapsed");
});

document.addEventListener("pointerdown", (e) => {
  if (!menuDropdown.contains(e.target) && !menuBtn.contains(e.target)) {
    menuDropdown.classList.add("collapsed");
  }
  if (!recordDropdown.classList.contains("collapsed")) {
    if (!recordDropdown.contains(e.target) && !recordToggle.contains(e.target)) {
      recordDropdown.classList.add("collapsed");
    }
  }
});

document.querySelectorAll(".select-wrap-sm").forEach(wrapper => {
  wrapper.addEventListener("click", e => {
    if (e.target.closest("select")) return;
    const select = wrapper.querySelector("select");
    if (!select || select.disabled) return;
    select.focus();
    select.click();
  });
});

const advHighlightBtnEl = document.getElementById("advHighlightBtn");
advHighlightBtnEl.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  if(chromaticHighlightState === 0){
    chromaticHighlightState = 1;
  } else if(chromaticHighlightState === 1){
    chromaticHighlightState = 2;
  } else {
    chromaticHighlightState = 0;
    chromaticHighlights.clear();
  }
  renderSelectors();
  applyScaleHighlights();
});

advBtn.addEventListener("click", (e) => {
  advMode = !advMode;
  if (advMode) {
    advBtn.classList.add("active");
    advBtn.dataset.info = "Show piano";
    advBtn.setAttribute("aria-label", "Show piano");
  } else {
    advBtn.classList.remove("active");
    advBtn.dataset.info = "Show more chords";
    advBtn.setAttribute("aria-label", "Show more chords");
  }
  document.getElementById("pianoKeyboard").style.display = advMode ? "none" : "flex";
  document.getElementById("advChordsKeyboard").style.display = advMode ? "flex" : "none";
  updatePianoSettingsState();
});

document.getElementById("chordWave").addEventListener("change", () => {
  stopSustain();
});

document.getElementById("arpeggioStyleSelect").addEventListener("change", () => {
  arpeggioCurrentStep = 0;
  updateArpeggioPaddingState();
});

document.getElementById("arpeggioPaddingToggle").addEventListener("click", () => {
  arpeggioWidePadding = !arpeggioWidePadding;
  arpeggioCurrentStep = 0;
  updateArpeggioPaddingState();
});

document.getElementById("chordPicker").addEventListener("change", e => {
  chordPicker = e.target.value;
  const rhythmSubControls = document.getElementById("rhythmSubControls");
  const arpeggioSubControls = document.getElementById("arpeggioSubControls");
  if (rhythmSubControls) rhythmSubControls.style.display = (chordPicker === "rhythm") ? "flex" : "none";
  if (arpeggioSubControls) arpeggioSubControls.style.display = (chordPicker === "arpeggio") ? "flex" : "none";
  
  stopSustain();
  stopRhythm();
  stopArpeggio();
  updateChordDecayState();
  updateInfo(false);
});

window.addEventListener("resize", () => {
  updateScaling();
  syncHeights();
});

if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", () => {
    updateScaling();
    syncHeights();
  });
}

window.addEventListener("orientationchange", () => {
  requestAnimationFrame(() => {
    updateScaling();
    syncHeights();
  });
});

let pianoModeKeyboard = false;
const keysHeld = new Set();

document.addEventListener("keydown", e => {
  if(e.repeat || ["INPUT","SELECT","TEXTAREA"].includes(e.target.tagName)) return;
  keysHeld.add(e.code);
  
  if(e.code === 'KeyL') {
    pianoModeKeyboard = !pianoModeKeyboard;
    return;
  }
  
  if(e.code in HARP_KEYS) {
    e.preventDefault();
    playHarpNote(HARP_KEYS[e.code]);
    return;
  }
  
  const chordRootIdx = CHORD_KEYS.indexOf(e.code);
  if(chordRootIdx !== -1) {
    e.preventDefault();
    if(pianoModeKeyboard) {
      const midi = 60 + chordRootIdx;
      const keyEl = document.querySelector(`.piano-key[data-midi="${midi}"]`);
      playPianoNote(midi, keyEl);
    } else {
      let type = 'major';
      for (const [code, t] of Object.entries(MOD_KEYS)) {
        if (keysHeld.has(code)) {
          type = t;
          break;
        }
      }
      selectChord(chordRootIdx, type);
    }
  }
});

document.addEventListener("keyup", e => {
  keysHeld.delete(e.code);
});

initPiano();
renderAdvChords();
render();
initKnobs();
initInfoHover();
updateArpeggioPaddingState();

function pauseAudioForPageLifecycle() {
  if (!audio) return;
  stopAllPlayback(true);
  if (audio.ctx.state === "running") {
    audio.ctx.suspend().catch(err => console.warn("Audio context suspend failed:", err));
  }
}

function resumeAudioForPageLifecycle() {
  // Safari may reject resume() here because returning to the page is not a user gesture.
}

document.addEventListener("pointerdown", () => {
  warmAudioOutput();
}, { capture: true });

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") {
    pauseAudioForPageLifecycle();
  } else {
    resumeAudioForPageLifecycle();
  }
});

window.addEventListener("pagehide", pauseAudioForPageLifecycle);
window.addEventListener("pageshow", resumeAudioForPageLifecycle);

window.addEventListener("load", ()=>{
  updateScaling();
  syncHeights();
});
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
        .then(reg => reg.update())
        .catch(err => console.log('Registration failed: ', err));
    });
}
</script>
