                            <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1, user-scalable=no">
<!-- iOS Web App capability tags -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Omnichord">
<!-- Links to your app icons and manifest -->
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">

<title>Omnichord</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-wrapper">
<div class="app" id="appContainer">
  <div class="center-content" id="centerContent">
    <div class="top-toolbar">
      <button class="controls-btn" id="sidebarToggle" title="Menu">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <button class="controls-btn rec-btn" id="recordToggle" title="Record MIDI">
        <span class="rec-dot"></span>
      </button>

      <div class="info-compact">
        <div class="current" id="current">C Major</div>
        <div class="notes" id="notes">C · E · G</div>
      </div>

      <div class="selectors-stack">
        <div class="selectors-desktop">
          <div class="key-tabs-inline" id="modeTabs"></div>
          <div class="key-tabs-row">
            <div class="key-tabs-inline" id="keyTabs"></div>
            <div class="select-wrap-sm" id="seventhTypeWrap">
              <label for="seventhType">7th</label>
              <select id="seventhType">
                <option value="dominant" selected>Dominant</option>
                <option value="major">Major</option>
                <option value="minor">Minor</option>
                <option value="all">All</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <div class="toolbar-right">
        <div class="toolbar-right-stack">
          <div class="select-wrap-sm">
            <label for="chordPicker">Artic</label>
            <select id="chordPicker">
              <option value="staccato">Staccato</option>
              <option value="sustain" selected>Sustain</option>
              <option value="legato">Legato</option>
              <option value="arpeggio">Arpeggio</option>
              <option value="mute">Mute</option>
            </select>
          </div>
        </div>

        <div class="timbre-container">
          <div class="select-wrap-sm">
            <label for="chordWave">Chords Timbre</label>
            <select id="chordWave">
              <option value="sine">Sine</option>
              <option value="square" selected>Square</option>
              <option value="sawtooth">Saw</option>
              <option value="triangle">Triangle</option>
            </select>
          </div>
          <div class="select-wrap-sm">
            <label for="harpWave">Harp Timbre</label>
            <select id="harpWave">
              <option value="sine">Sine</option>
              <option value="square" selected>Square</option>
              <option value="sawtooth">Saw</option>
              <option value="triangle">Triangle</option>
            </select>
          </div>
          <div class="select-wrap-sm">
            <label for="pianoWave">Piano Timbre</label>
            <select id="pianoWave">
              <option value="sine" selected>Sine</option>
              <option value="square">Square</option>
              <option value="sawtooth">Saw</option>
              <option value="triangle">Triangle</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <div class="controls-dropdown collapsed" id="controlsDropdown">
      <div class="section-label-header">Beat</div>
      <div class="beat-row">
        <div class="select-wrap">
          <label for="rhythm">Rhythm</label>
          <select id="rhythm">
            <option value="rock" selected>Rock (4/4)</option>
            <option value="waltz">Waltz (3/4)</option>
            <option value="blues_shuffle">Blues Shuffle (12/8)</option>
            <option value="kalamatianos">Kalamatianos (7/8)</option>
            <option value="take_five">Take Five (5/4)</option>
          </select>
        </div>
        <div class="transport" id="play">▶ Start</div>
      </div>
      <div class="range-wrap">
        <label for="tempo">Tempo</label>
        <input id="tempo" type="range" min="50" max="180" value="100">
        <span class="range-value" id="tempoValue">100</span>
      </div>

      <div class="section-label-header">Volumes</div>
      <div class="range-wrap">
        <label for="rhythmVolume">Rhythm Vol</label>
        <input id="rhythmVolume" type="range" min="0" max="100" value="100">
        <span class="range-value" id="rhythmVolumeValue">100%</span>
      </div>
      <div class="range-wrap">
        <label for="chordVolume">Chord Vol</label>
        <input id="chordVolume" type="range" min="0" max="100" value="20">
        <span class="range-value" id="chordVolumeValue">20%</span>
      </div>
      <div class="range-wrap">
        <label for="harpVolume">Harp Vol</label>
        <input id="harpVolume" type="range" min="0" max="100" value="30">
        <span class="range-value" id="harpVolumeValue">30%</span>
      </div>
      <div class="range-wrap">
        <label for="pianoVolume">Piano Vol</label>
        <input id="pianoVolume" type="range" min="0" max="100" value="30">
        <span class="range-value" id="pianoVolumeValue">30%</span>
      </div>

      <div class="section-label-header">Envelopes</div>
      <div class="range-wrap">
        <label for="chordRelease">Chord</label>
        <input id="chordRelease" type="range" min="0" max="0.8" step="0.05" value="0.6">
        <span class="range-value" id="chordReleaseValue">75%</span>
      </div>
      <div class="range-wrap">
        <label for="harpRelease">Harp</label>
        <input id="harpRelease" type="range" min="0.1" max="1.5" step="0.05" value="1.15">
        <span class="range-value" id="harpReleaseValue">75%</span>
      </div>
      <div class="range-wrap">
        <label for="pianoRelease">Piano</label>
        <input id="pianoRelease" type="range" min="0.1" max="1.5" step="0.05" value="1.15">
        <span class="range-value" id="pianoReleaseValue">75%</span>
      </div>
    </div>

    <div class="record-dropdown collapsed" id="recordDropdown">
      <div class="section-label-header">YOU ATE THAT</div>
      <div style="font-size:12px;color:#8e8e93;line-height:1.4;">You didn't have a pen and paper. You got to the mic, you're like, oh, press record ah ah ah driver roll up the partition please.</div>
      <div class="beat-row" style="margin-top:4px;">
        <button class="transport" id="discardMidiBtn" style="background:#2c2c2e;color:#ff453a;">Discard</button>
        <button class="transport" id="saveMidiBtn" style="background:#0a84ff;color:#fff;">Save MIDI</button>
      </div>
    </div>

    <div id="chordArea"></div>

    <div class="piano-wrap" id="pianoKeyboard"></div>
  </div>

  <div class="vertical-harp" id="verticalHarpSegment">
    <div class="harp-container">
      <div class="harp-grid" id="harpGrid"></div>
    </div>
  </div>
</div>
</div>

<script src="script.js"></script>
</body>
</html>
